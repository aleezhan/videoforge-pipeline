# Стиль отрисовки — ресурс. Подключается строкой resources.style: $id
id: $id
name: $name
description: ""

# Начало каждого промпта картинки (по-английски): техника, свет, общее настроение.
# Сюда идёт ТОЛЬКО то, что верно для КАЖДОГО кадра эпизода: техника рисунка,
# характер контура и тени, общая температура света. Акценты — частицы, сияние,
# дым, лучи — пишет планнер в visual_prompt той сцены, где у них есть источник.
# Акцент в префиксе попадает во все кадры подряд: «floating particles» в стиле
# flat_cartoon_warm дали жёлтые точки в 38 кадрах из 105 (ep001, 08.09.2026).
prompt_prefix: ""

# Конец промпта: композиция, качество.
prompt_suffix: ""

# Чего не должно быть — уйдёт в промпт как "Avoid: ...".
negative: ""

# Чего не должно быть в ПРОМПТЕ сцены — страж до генерации: планнер переспросит
# модель, стадия картинок откажется рендерить, и всё это до платного вызова.
# Фразы как написаны, словом целиком: ["crucifix", "wine glass"]. Художнику не
# уходит — в отличие от negative, из которого по словам проверяются только
# очевидные термины (text, photorealistic, 3D render, painterly, watermark,
# logo — карта синонимов в videoforge/stages/style_conflict.py).
forbid: []

# Добавка к каждому motion_prompt для видео: характер движения камеры.
motion_hint: ""

# Что проверяющая модель сверяет по стилю на каждом кадре.
checklist: []
#  - Стиль — 3D-мультфильм, не фотореализм и не 2D-рисунок
