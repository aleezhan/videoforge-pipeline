# Фон раскладки circle — видео на весь кадр под кружком (своя запись или
# лицензированный сток). Включается в project.yaml:
# video.reframe: {layout: circle, background: $id}.
# Звук фона не используется. Файл длиннее любого ролика: каждый эпизод берёт
# свой кусок по id эпизода. Файл тяжёлый и под .gitignore.
id: $id
name: $name
file: $id.mp4                 # видеофайл рядом с этим YAML
license: ""                   # "CC0" | "свой" | лицензия стока
source: ""                    # откуда: URL и кусок (2:00–7:00)
tags: []                      # [abstract, loop]
