# Приём библиотеки: что можно применить в этой точке решения и когда.
# Заполняется человеком (или командой /new-technique) и читается стадиями.
#
# Главное правило: сюда идут ФОРМА приёма и МЕТОД, а не подогнанные числа.
# Кривая коррекции, снятая с конкретного релиза, живёт в папке эпизода;
# здесь — «тени в ноль, света чуть вверх, насыщенность +8%» и как это померить.

id: $id
decision: $decision           # точка решения; список — videoforge lib decisions
title: $title
summary: ""                   # одна строка: в чём приём, чтобы было видно в списке

# implemented — умеем, и в implemented_by сказано чем.
# recorded    — видели у других, не умеем. Это честный ответ «такое мы пока не
#               делаем» вместо молчания; список recorded — очередь на реализацию.
status: recorded

# Когда применять. Пустые условия ЗАПРЕЩЕНЫ: «всегда» пишется явно (always: true),
# чтобы это было решением, а не забывчивостью. Ключи — только из словаря
# (videoforge lib conditions); значение может быть списком допустимых.
always: false
applies_when: {}
#  format: [anime_edit, clips_from_long]
#  has_speech: true
never_when: {}
#  footage: generated

# Числа, которые у приёма постоянны (диапазоны, пороги). Не путать с подгонкой
# под конкретный ролик.
params: {}
#  length_sec: 0.5
#  range_sec: [0.3, 0.6]

implemented_by: ""            # стадия/функция/настройка, которая это делает

# Откуда приём взялся. Без этого он — мнение, а не знание.
# verdict: works | failed | n/a. Запись об ОПРОВЕРЖЕНИИ ценнее подтверждения:
# она останавливает повторную ошибку.
evidence: []
#  - source: "reference reel, @rvez_, 19k лайков"
#    measured: "последние 0.5 с: 1.31 → 0.66 → 0.41 → 0.22 → 0.04 → 0"
#    date: "2026-09-05"
#    verdict: works

notes: ""                     # оговорки, ловушки, порядок операций
