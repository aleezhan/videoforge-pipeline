# Анализ чужого контента: закономерности успешного канала → формула → blueprint.
# Стадии пишут артефакты рядом: 01_collect/channel.json (метаданные),
# 02_stats/stats.json (динамика, выбросы), дальше — classify/deep/formula.
# Бюджет и ворота — в manifest.json (поле budget_usd читает бюджетный страж).
id: $id
mode: $mode            # channel — весь канал | video (фаза 3) | competitors (фаза 4)
platform: youtube      # пока только youtube
collector: $collector  # ytdlp — без ключей (фаза 1) | mock — бесплатная заглушка
urls:
$urls
goal: $goal            # зачем анализ: что хотим понять и повторить
language: $language    # язык выводов анализа в отчёте (цитаты — в оригинале)
max_videos: $max_videos          # 0 — все видео канала; N — только N последних
outlier_threshold: $outlier_threshold  # порог выброса: auto — по разбросу самого канала
                       #   (медиана ratio + 3 сигмы по MAD, считается отдельно
                       #   для shorts и длинных); число — жёсткое "N x медиана соседей"
deep_top: $deep_top              # сколько лучших видео разбирать глубоко (стадия deep)
deep_worst: $deep_worst            # сколько слабых видео разбирать как контрольную группу:
                       #   приём, который есть и в хитах, и в провалах, ничего не
                       #   объясняет. 0 — не разбирать
deep_videos: $deep_videos        # явные id видео для deep; пусто — топ по ratio из статистики
scene_threshold: $scene_threshold      # чувствительность детекта смен картинки (стадия visual):
                       #   0.05 — плоская 2D-анимация (мягкие переходы), 0.3 —
                       #   живое видео и дроны. Не угадывать: контактный лист
                       #   раз в 1–2 с, посчитать смены глазами, сравнить с
                       #   detect_cuts. Мимо порога — весь ритм монтажа враньё
rpm_usd: {}            # $$ за 1000 просмотров [мин, макс] по группам; пусто — брать оценку
                       #   LLM из classify; своя вилка: {long: [1, 5], shorts: [0.05, 0.2]}
