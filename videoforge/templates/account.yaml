# Аккаунт на площадке: куда уходят ролики проекта. Один файл — один аккаунт.
# Проект, у которого есть хотя бы один аккаунт, считается живым; без аккаунтов —
# демо / в разработке. Статус нигде не хранится, он выводится отсюда.
id: $id
network: $network             # youtube | tiktok | instagram — сеть, а не формат ролика
project: $project             # id из projects/: чей контент публикует аккаунт.
                              # Пусто — свой аккаунт, ещё ни к чему не привязанный.
                              # Чужой канал сюда не пишется, ему место в research/

handle: $handle               # @имя на площадке
url: $url                     # ссылка на канал/профиль — по ней собирается статистика
channel_id: $channel_id       # технический id (UC… у YouTube); пусто — определится при sync
title: $title                 # название канала, как его видит зритель
partner: false                # канал в Партнёрской программе YouTube. Что от этого зависит:
                              # свою обложку шортсу YouTube принимает только у партнёрских
                              # каналов — без этого публикация обложку шортса не шлёт, а
                              # называет секунду кадра, чтобы выбрать его руками

notes: ""                     # что угодно для себя: когда завели, чем отличается, планы

# Статистика живёт рядом, не здесь:
#   accounts/$id/stats.jsonl  — снимки (videoforge account sync $id), строка на замер
#   accounts/$id/videos.json  — последний список роликов площадки с просмотрами
# TikTok и Instagram числа автоматически не отдают:
#   videoforge account sync $id --manual subscribers=1200 views_total=34000
