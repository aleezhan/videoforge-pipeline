# Полезный источник: чужой сайт, сервис, канал или статья, на которые стоит
# вернуться. Один файл — одна закладка. Это НЕ features/: там возможности
# самого инструмента, здесь — чужое, что мы только посмотрели.
# Пишется для человека без контекста разговора: summary читается за десять секунд.
id: $id
title: $title
url: $url
kind: $kind                   # service | tool | channel | article | docs | assets | community | other
area: $area                   # где может пригодиться: script | planner | images | video | audio
                              # | edit | assemble | qa | publish | accounts | clips | intel
                              # | resources | gpu | ui | other

summary: $summary             # что это, простым языком: как объяснить другу за минуту

why: $why                     # зачем нам: где в нашей работе это может пригодиться

cost: $cost                   # сколько стоит и на каких условиях, если это сервис

tags: []                      # свободные метки для поиска глазами
added: $added                 # дата записи
checked: $checked             # когда последний раз открывали: чужой сайт умирает молча
source: $source               # откуда взялось: разговор такого-то числа, чужой канал
notes: ""                     # оговорки: риски, чем не подошло, что проверить
