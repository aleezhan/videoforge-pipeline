# Предмет — визуальный ресурс: фишка, которая должна выглядеть одинаково во
# всех эпизодах. Указывается в касте сцены: cast: ["props/$id", ...]
id: $id
name: $name

# Что это по-русски и почему важно (фишка героя, магический предмет…).
description: ""

# Вставляется в промпт картинки, когда предмет в касте сцены. По-английски и
# конкретно: форма, размер, цвета, материал, узнаваемые детали.
# Например: "an old brass pocket compass with a cracked glass lid and a red
# needle, worn leather strap"
prompt_block: ""

# Портфолио: положи 1–2 картинки в папку рядом — resources/…/props/$id/ —
# они подхватятся автоматически. Явный список ниже — только чтобы выбрать
# конкретные кадры из папки.
reference_images: []

# Что проверяющая модель сверяет, когда предмет в кадре.
checklist: []
#  - Компас латунный с треснувшим стеклом и красной стрелкой — как на референсе
