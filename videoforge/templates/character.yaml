# Персонаж — ресурс. Подключается к проекту строкой resources.character: $id
# Код про персонажа не знает: всё, что он есть, — этот файл и папка-портфолио.
#
# Персонаж — это лицо, тело и характер. Одежда, обувь, предметы и «что должно
# быть в кадре» — свойства сцены/эпизода, здесь их НЕ описывать.
id: $id
name: $name

# Кто это по-русски: возраст, роль, характер. Для сценариев и для людей.
description: ""

# «Паспорт» — вставляется в каждый visual_prompt. По-английски и коротко:
# возраст, телосложение, цвет волос/глаз/кожи и 2–3 стабильные приметы (шрам,
# необычный цвет глаз, фирменная деталь) — персонажа с приметами любая модель
# держит лучше «обычного человека». Лицо держат референсы из портфолио;
# паспорт страхует внешность при смене модели и задаёт самую первую генерацию.
prompt_block: ""

# Портфолио: …/characters/$id/. Кадры из КОРНЯ папки идут референсами в каждую
# сцену — держи там ядро из ~7 кадров одного и того же лица, имена файлов по
# содержимому: face_front, face_three_quarter, face_profile, body_full_front,
# body_full_back, body_waist_up, face_expression_smile. Образы и архив — в
# подпапках (looks/, archive/): они НЕ подхватываются автоматически.
# Сгенерировать ядро: videoforge resource gen-portfolio character $id --style <стиль>
# Явный список ниже нужен, только чтобы выбрать конкретные кадры вручную.
reference_images: []
#  - $id/face_front.png

# Обученные веса персонажа для художника на своей карте (ComfyUI, klein 4B):
# с ними лицо держит LoRA, а в промпт идёт триггер вместо паспорта. Файл —
# относительно папки characters/. Пусто — художник рисует по паспорту и референсам.
# lora:
#   file: $id/lora/$id_klein4b_v1.safetensors
#   trigger: $id
#   base: klein4b
#   strength: 1.0

# Что проверяющая модель сверяет на каждом кадре: только идентичность.
# Одежду НЕ проверять — она меняется от сцены к сцене и задаётся сценой.
checklist: []
#  - Лицо, причёска и цвет глаз соответствуют референсам
#  - Возраст читается как ~8 лет
#  - Особые приметы на месте: шрам над левой бровью
#  - Один персонаж в кадре, без дублей
