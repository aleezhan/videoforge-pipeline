# Место (локация) — визуальный ресурс: должно выглядеть одинаково во всех
# эпизодах. Указывается в касте сцены: cast: ["locations/$id", ...]
id: $id
name: $name

# Что это за место по-русски: для сценариев и для людей.
description: ""

# Вставляется в промпт картинки, когда место в касте сцены. По-английски и
# конкретно: что это, из чего, какие узнаваемые детали, освещение по умолчанию.
# Например: "grandpa's wooden house interior, log walls, a round table by the
# window, an old green armchair, warm lamp light"
prompt_block: ""

# Портфолио: положи 1–4 картинки в папку рядом — resources/…/locations/$id/ —
# они подхватятся автоматически. Явный список ниже нужен, только если хочешь
# выбрать конкретные кадры из папки.
reference_images: []

# Что проверяющая модель сверяет, когда место в кадре.
checklist: []
#  - Стены бревенчатые, у окна круглый стол — как на референсе
