# Проект = канал или серия видео. Эпизоды лежат в episodes/, каждый при создании
# наследует эти настройки (дальше у эпизода своя раскадровка).
# Правила для режиссёра и планнера — в rules.md рядом.
id: $id
name: $name
description: $description

workflow: $workflow              # workflows/<имя>.yaml — порядок стадий: ai_video | clips_from_long

# channel — канал или серия, ролики уходят зрителю; test — полигон качества:
# ролики делают, чтобы посмотреть глазами «что мы уже умеем». Тестовый проект не
# попадает в «живые» проекты пульта, у него своя страница «Тесты», и публиковать
# его ролики не надо
kind: $kind

channel:
  name: $channel_name           # название канала/аккаунта
  platforms: [$platforms]       # youtube_shorts | tiktok | instagram_reels | youtube
  language: $language           # язык сценария и озвучки
  privacy: private              # с какой видимостью ролик ложится на площадку:
                                # private | unlisted | public. private — первый
                                # ролик смотрят уже на площадке и открывают
                                # руками; канал на каденсе ставит public, иначе
                                # каждый день добавляется ручное действие
  category: ""                  # тематический раздел канала — полка, на которую
                                # площадка кладёт ролик: autos | comedy |
                                # education | entertainment | film | gaming |
                                # howto | music | news | nonprofit | people |
                                # pets | science | sports | travel. Пусто — не
                                # объявлен: загрузка ставит нейтральный «Люди и
                                # блоги», а у уехавшего ролика правка раздел не
                                # трогает (его мог выбрать человек в Studio).
                                # Объявлен — побеждает файл, как и везде

video:
  aspect_ratio: "$aspect_ratio"                # 9:16 вертикаль | 16:9 горизонталь | 1:1
  target_duration_sec: $target_duration_sec    # целевая длительность эпизода, сек
  scene_duration_sec: $scene_duration_sec      # медиана длины картинки — ориентир планнеру
                                # (замер разобранных каналов), а не норма: длину
                                # сцены задаёт содержание; короче 2 с сцена не
                                # читается. Из него планнер считает слова на
                                # картинку (× 2 слова/с). Ролик-история ~9.5
                                # (два предложения на картинку, длинные планы
                                # 15–24 с со словами), ролик-список ~6 (одно
                                # предложение) — замер research/_probes/
                                # scene_cuts_2026-09-17. Число сцен не ограничено,
                                # деньги держит бюджет. Факт длины меряется по озвучке
  scene_tail_sec: 0.5           # сколько кадр живёт после последнего слова сцены
  scene_threshold: 0.05         # чувствительность детектора смен картинки: 0.05 —
                                # 2D-анимация, 0.3 — живое видео. По нему пульт
                                # разбирает готовый ролик на планы, когда раскадровки нет
  captions: true                # субтитры в сборке; как выглядят — resources.caption_style
  captions_language: null       # язык субтитров, если не совпадает с языком речи:
                                # en — русская речь, английский текст (стадия translate).
                                # null — субтитры на языке речи
  music: $music_on                  # фоновая музыка в сборке; трек — resources.music
  fade_in_sec: 0.3              # затемнение на входе эпизода
  fade_out_sec: 0.8             # и на выходе
  zoom_per_sec: 0               # наезд генеративного клипа, доля масштаба в секунду
                                # (0.02 — 12% за 6 с). Сшивает стык продолжений
                                # длинного плана: i2v начинает каждый клип с исходного
                                # масштаба, сборка кропает продолжение до конца
                                # предыдущего звена. 0 — не сшивать; remotion не нужен
  clip_share: 1.0               # доля хронометража настоящими клипами (0–1). 1.0 — все
                                # сцены клипами видеопровайдера. 0.2 — пятая часть
                                # клипами, остальные сцены — готовый кадр с программным
                                # наездом или панорамой (VF_STILL_PROVIDER, по умолчанию
                                # remotion, $0): длинный ролик на карте в разы дешевле.
                                # Какие сцены клипами, решает стадия video один раз и
                                # пишет в storyboard.json (scenes[].render: clip | still);
                                # поле, поправленное руками, побеждает
  clip_opening_share: 0.1       # первые столько хронометража — клипами целиком: зритель
                                # в начале видит движение. Остаток доли рассыпается по
                                # ролику равномерно, в первую очередь на сцены с
                                # действием (tempo: action) и с героем в кадре
  frame_rules: []               # правила канала для проверки кадров, по-английски, строкой
                                # на правило: нарушение — брак и повтор кадра. Например:
                                # - "no readable text on signs and screens"
  # --- нарезки (workflow clips_from_long); ai_video эти три поля не читает ---
  reframe: null                 # раскладка кадра для всех сцен канала; сцена со своим
                                # reframe в раскадровке побеждает. null — окно 9:16 по
                                # лицам. {layout: fit} — кадр исходника целиком по
                                # ширине на чёрном поле, над ним подпись, под ним
                                # субтитры (так режут мультсериалы: шутка держится на
                                # всём кадре, а лиц детектор не видит); fill: blur —
                                # поле из размытой копии кадра; punch: 1.33 — кадр 4:3
                                # крупнее, 1.78 — квадрат. {layout: circle, background:
                                # <id>} — клип в кружке поверх фонового видео
                                # (resources/backgrounds/); x, y — центр квадрата из
                                # кадра, пусто — по лицам
  headline: false               # подпись над кадром на весь ролик: реакция зрителя
                                # со сленгом и эмодзи («Jerry was INCHES from death 😭»).
                                # Пишет критик моментов, рисует сборка
  grade: ""                     # цветокоррекция готового ролика: lift — чуть ярче и
                                # сочнее (так у нарезчиков мультсериалов), punch — тени
                                # в ноль и света вверх, vivid — контраст, насыщенность
                                # и резкость, warm — теплее. Пусто — кадр как есть.
                                # У эпизода своё поле grade в storyboard.json
  tighten: false                # выбрасывать скучные реплики внутри момента: критик
                                # называет лишние, эпизод собирается из нескольких
                                # отрезков источника жёсткими склейками

# Подложка — второй слой звука, отдельный от музыки: ровный эмбиенс под ВСЕЙ
# дорожкой, поверх которого трек с развитием вступает к кульминации. Нужна
# потому, что тихое вступление такого трека — это и есть тишина между
# репликами (у devastation_and_revenge первые 10 с на 23 дБ ниже его же
# интеграла). Ресурс — music с bed: true (videoforge resource gen-music <id>
# --preset flat_pad); план монтажа может выключить: bed: {track: null}
audio:
  music_gain_db: null           # насколько трек тише голоса У ЭТОГО КАНАЛА, дБ.
                                # null — как записано у самого ресурса
                                # (resources/music/<id>.yaml, gain_db). Нужен потому,
                                # что один трек стоит у нескольких проектов, а
                                # «насколько громко» — решение канала: под плотный
                                # звук мультсериала трек просят громче, чем под
                                # спокойную начитку. План монтажа (music.gain_db)
                                # впереди и проекта, и ресурса
  bed: null                     # id из resources/music/ с bed: true; null — слоя нет
  bed_gain_db: -28              # уровень подложки ОТНОСИТЕЛЬНО голоса: слышна в
                                # паузах (выше детектора тишины −40 дБ и выше
                                # вступления трека), но не читается как музыка
                                # (на 21 дБ ниже пика дропа); под речью прибавляет
                                # 0.007 дБ, поэтому даккинга у неё нет

# Водяной знак канала в углу кадра — необязательный слой сборки (у нарезок это
# единственный собственный элемент графики). Файл рисует человек: PNG с альфой,
# лежит в папке проекта рядом с этим файлом. file пуст — слоя нет.
# Положение считает сборка: угол минус отступ и ВНЕ зоны интерфейса площадок
# канала (та же ui_zone, по которой QA судит субтитры): в правом углу знак
# встаёт левее колонки кнопок, в нижнем — выше блока «канал / описание / звук».
# Знак лежит ПОД субтитрами; QA замечает, если он попал в их полосу или в зону
# интерфейса. Смена файла или чисел пересобирает финал
watermark:
  file: null                    # watermark.png — путь относительно папки проекта
  corner: top_right             # top_left | top_right | bottom_left | bottom_right
  width_pct: 12                 # ширина знака, % ширины кадра (высота — по картинке)
  opacity: 0.7                  # непрозрачность 0–1
  margin_pct: 3                 # отступ от краёв, % короткой стороны кадра

# Ресурсы по id из resources/<kind>/. Сменить персонажа — поправить строку.
resources:
  character: $character
  style: $style
  voice: $voice
  niche: $niche
  caption_style: $caption_style   # resources/caption_styles/: шрифт, размер, подсветка слова
  music: $music                   # resources/music/: трек с license и source; null — без музыки

research: $research    # id анализов из research/, на которых основан канал:
                       #   их blueprint.md (формула, правила хука, ритм монтажа)
                       #   получает планнер. Пусто — канал придуман без анализа

budget_per_episode_usd: $budget  # лимит расходов на эпизод → manifest.json

rules_file: rules.md

hidden: false          # true — образец или полигон, не канал: пульт не показывает
                       # его в списке проектов (CLI и конвейер видят как обычно)
