[project]
name = "videoforge"
version = "0.1.0"
description = "File-based video production pipeline: script -> storyboard -> frames -> video -> audio -> assembly -> publishing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "pillow>=10.1",
    "imageio-ffmpeg>=0.5",
    "httpx>=0.27",
    "google-genai>=1.30",
    "fal-client>=0.5",
    "edge-tts>=7.0",
    "yt-dlp>=2026.8.19",
    # 9:16 reframing of clips: YuNet face detector (cv2.FaceDetectorYN); headless build
    "opencv-python-headless>=4.10",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
# TikTok/Instagram upload through a browser form (their APIs require app review).
# Heavy and only needed at upload time: `uv sync --extra publish`, then
# `playwright install chromium`
publish = ["playwright>=1.47"]
# local speech/vocal recognition with word timings taken from the audio itself,
# for sources without reliable captions. The model (hundreds of MB) downloads on
# first use: `uv sync --extra transcribe`
transcribe = ["faster-whisper>=1.1"]

[project.scripts]
videoforge = "videoforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["videoforge"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[tool.ruff]
line-length = 100
target-version = "py312"
# docs/reference: third-party excerpts; research/_probes and projects/_bench: local
# one-off probe scripts (git-ignored). None of these are linted or formatted.
extend-exclude = ["docs/reference", "research/_probes", "projects/_bench"]

[tool.ruff.format]
# Markdown: ruff formats python blocks inside .md, but the schemas in our docs are
# intentionally compact. projects/tests/episodes: local build scripts whose clip
# tables are one row per line.
exclude = ["*.md", "projects/tests/episodes/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Same scripts: only line length is relaxed (one clip per row); all other checks apply.
"projects/tests/episodes/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# typer declares CLI parameters as calls in defaults; that is its API, not a bug
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers: a typo in a marker is a collection error, not a silently ignored marker
addopts = "--strict-markers"
markers = [
    # renders video with ffmpeg and takes seconds; tests/conftest.py checks the marker
    "render: renders video with ffmpeg (slow); excluded from the fast subset",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
