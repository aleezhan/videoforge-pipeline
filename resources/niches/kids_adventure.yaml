# Ниша — ресурс для режиссёра/планнера: кому, в каком тоне, какие крючки.
id: kids_adventure
name: Детские приключения
description: Короткие истории про любопытного ребёнка, который исследует мир.
audience: дети 5–10 лет и родители, смотрят вместе
tone: тёплый, добрый, с лёгкой интригой; без страха и жестокости
hooks:
  - Загадка в первые 3 секунды (находка, странный звук, карта)
  - Одна простая цель на ролик
  - Финал с маленьким открытием и намёком на продолжение
