# Ниша — кому и как. Ресурс многоразовый: одна ниша может обслуживать несколько
# проектов. Специфика конкретного канала — в projects/<id>/rules.md.
#
# Заполнено по research/kurzgesagt_de (разбор 187 видео) и research/playbook.md.
# Правила, которые playbook пометил спорными, сюда попали только потому, что их
# область сужена ровно до этой ниши — на travel-канале они не сработали.
id: sci_explainer
name: "Объясняющий научпоп"
description: >
  Гипотетический эксперимент или разбор большого явления на 8–11 минут:
  вопрос в заголовке, счётчик через весь ролик, отложенная выплата обещания.
audience: >
  Взрослые 18–34, смотрят с телефона и с телевизора ради ощущения «понял
  что-то большое»; тема должна касаться их лично, иначе остаётся лекция.
tone: >
  Спокойный документальный голос, короткие предложения по одному факту.
  Прямое «ты» в моменты угрозы, «мы» в моменты действия. Тёмный юмор — одна-две
  шутки на ролик. «Мы не знаем наверняка» — говорить вслух: это повышает
  доверие и оставляет крючок.
hooks:
  - Признать мотив зрителя, а не определять тему («взрывы — это весело», «мир кажется скучным»)
  - В первые 30 секунд развернуть тему на самого зрителя — иначе это лекция
  - "В первые 10 секунд объявить границы эксперимента: что именно покажут и в каком масштабе"
  - Заставку и бренд — не раньше 25-й секунды, сначала вопрос
topics:
  - Что будет, если <привычная вещь> исчезнет на один день
  - Сколько на самом деле <большая величина> в бытовых предметах
  - Почему <очевидное явление> устроено не так, как все думают
avoid:
  - "Оставлять число голым: любую величину переводить в телесную меру или эталон"
  - Выносить ответ на главный вопрос во внешний продукт — закрывать внутри ролика
  - Ставить CTA до эмоционального пика
  - Заканчивать моралью вместо тихого образа

# Правила производства из тестовых проектов sci_ru / sci_mini (01–05.09.2026,
# проекты удалены 09.09.2026). Это то, чего
# разбор чужого канала знать не может, — переносить в rules.md нового проекта
# этой ниши:
# - Каждое число проверяемо по открытому источнику; где наука не знает —
#   говорить «мы не знаем наверняка», а не уверенную формулировку.
# - Одна сквозная величина-счётчик на ролик, названная в первую минуту; финал —
#   тихий образ, не мораль.
# - Постоянного персонажа нет: люди — обобщённые силуэты без лиц, так снимается
#   «лицо поплыло между кадрами».
# - Внутри кадра ничего не анимируется: один клип = неподвижная иллюстрация +
#   движение камеры (наезд, параллакс, частицы, смена палитры); формы не
#   морфятся, счётчики не тикают. Масштаб между сценами — лесенкой:
#   деталь → объект → система.
# - Сцена без слов на минутном хронометраже — не длиннее 3 с и не больше одной
#   подряд: 5 с немого зума зритель назвал «тупо и бессмысленно» (sci_mini/ep001).
# - Реплика ≈ 14 слов на 6.5 с, одно утверждение на реплику; термин всегда с
#   бытовым сравнением в той же или следующей реплике.
