# Стиль отрисовки — ресурс. Подключается строкой resources.style: flat_cartoon_warm
id: flat_cartoon_warm
name: "Плоский мультфильм с толстым контуром, тёплый"
description: "Мягкая 2D-иллюстрация в духе референсного канала (замер по кадрам 07.09.2026): тонкий контур, cel-тень с мягкими градиентами, тёплый золотой свет против холодной сине-серой тени; цвет кодирует смысл (золото — душа и рай, красно-чёрное — тьма). Сияние и частицы — акцент ПО СЦЕНЕ, где есть источник света (лампа, огонь, звёзды, луч из окна), а не фон каждого кадра: в ep001 (08.09.2026) они стояли в префиксе и оказались в 38 кадрах из 105. Мечети, дворики, пустыня, звёздное небо, могила как тёмный простор со светом. Мультяшно, но спокойно — без карикатуры и без фотореализма. Текст, схемы и списки — слой сборки поверх кадра (Scene.overlay), не внутри картинки. Обложки рисуются жирнее (толстый контур, крупные формы) — это отдельный промпт, не этот стиль."

# Начало каждого промпта картинки (по-английски): техника, свет, общее настроение.
# Только то, что верно для КАЖДОГО кадра. Акценты (частицы, сияние, дым) пишет
# планнер в visual_prompt той сцены, где им есть причина.
prompt_prefix: "soft 2D digital illustration, gentle thin outlines, cel shading with smooth gradients, warm golden key light against cool blue shadows, calm and reverent mood,"

# Конец промпта: композиция, качество.
# Кадрирование сюда не пишем: формат — свойство эпизода (aspect_ratio), а не
# стиля. Прежний суффикс требовал «wide 16:9 framing» и воевал с вертикальным
# эпизодом того же проекта (ep002, 09.09.2026).
prompt_suffix: "one clear focal subject, simple readable composition with breathing room, high quality"

# Чего не должно быть — уйдёт в промпт как "Avoid: ...".
negative: "photorealistic, 3D render, text, letters, watermark, logo, extra fingers, deformed face, blurry, low quality, angels with faces or gender, depiction of prophets, cross, alcohol"

# Добавка к каждому motion_prompt для видео: характер движения камеры.
motion_hint: "slow gentle push-in or pan, static composition, no camera shake; character keeps the same appearance throughout"

# Что проверяющая модель сверяет по стилю на каждом кадре.
checklist:
  - "Стиль — мягкая плоская 2D-иллюстрация с тонким контуром и cel-тенью (как в prompt_prefix), не фотореализм, не 3D-рендер, не полутоновая живопись"
  - "Нет текста, букв и знаков в кадре"
  - "Нет ангелов с лицами и нет изображений пророков"
