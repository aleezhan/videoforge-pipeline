# Фоновая музыка — ресурс. Подключается строкой resources.music: raw_castle
# и включается video.music: true в project.yaml.
# ПРАВА ОБЯЗАТЕЛЬНЫ: без license и source сборка трек не возьмёт — случайный файл
# снимает монетизацию или блокирует ролик (Content ID).
id: raw_castle
name: "Raw Castle (shiiva)"
file: raw_castle.mp3                 # аудиофайл рядом с этим YAML (mp3/wav/flac/ogg)
license: "трек дал владелец 19.09.2026 (inbox), лицензия не проверена"  # "CC0" | "CC BY 4.0 (автор …)" | "куплена: …" | "своя"
source: "shiiva — Raw Castle; файл владельца: inbox/2026-09-19/shiiva-raw-castle.mp3"  # откуда: URL или описание
attribution: ""               # строка кредита, если лицензия требует упоминания (CC BY):
                              # её дословно кладёт в 06_publish/publish.md стадия publish
lyrics: ""                    # слова песни с таймингами (.vtt, .srt) или текстом (.txt).
                              # Не для рендера: пульт кладёт их дорожкой под волну трека.
                              # Пусто — ищется файл того же имени рядом с треком
mood: "бодрая, ровная, фоном под диалог"  # настроение словами: спокойная, тревожная, бодрая
energy: 0.6  # 0..1
bpm: null
drop_sec: null                # секунда, с которой трек выходит на полную. Не для рендера:
                              # план сажает дроп на кульминацию (music.start_sec =
                              # кульминация − drop_sec). null — трек ровный
loop_ok: true                 # зациклить, если ролик длиннее трека
starts: [0, 36.25, 74.94, 110.1]  # начало, два входа после тихих мест (замер огибающей 19.09.2026) и удар посередине
                              # каждому ролику свою часть трека (по id эпизода), чтобы
                              # канал не звучал одинаково. Пусто — всегда с начала
bed: false                    # true — подложка: ровный зацикливаемый эмбиенс без
                              # развития для слоя audio.bed проекта (лежит под всей
                              # дорожкой на одном уровне, музыка вступает поверх).
                              # Ровную синтезирует videoforge resource gen-music
                              # <id> --preset flat_pad
tags: [background, cartoon]  # для выбора трека монтажом: [ambient, science, calm]
gain_db: -20.0  # тихо, фоном: на 20 дБ ниже голоса — клип не перебивает (слово владельца 19.09.2026)
                              # 12 дБ тише речи; трек сначала приводится к уровню голоса)
duck_db: 6.0  # под речью уходит ещё на 6 дБ
