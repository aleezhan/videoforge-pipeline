# Стиль субтитров — ресурс. Подключается строкой resources.caption_style: cartoon_bangers
# Тайминги слов приходят из озвучки (edge-tts), стиль их только рисует.
# Цвета — "#RRGGBB". Шрифты лежат в videoforge/assets/fonts/ (OFL, с кириллицей):
#   PT Sans      → PTSans-Bold.ttf        спокойный, читается мелким
#   Russo One    → RussoOne-Regular.ttf   тяжёлый плакатный, для шортсов
# Свой шрифт: положи .ttf рядом и укажи имя семейства и файл.
id: cartoon_bangers
name: "Cartoon: Bangers"
# Приёмы библиотеки, из которых собран стиль: "<точка>/<id>". Происхождение, а
# не исполнение — пульт покажет, что выбрано и почему (условия и замеры лежат у
# приёма), и на странице приёма — где он уже применён.
#   videoforge lib list caption_font | caption_color | caption_animation | captions
techniques: []
# В каком формате показывать пример стиля в пульте: 9:16 | 16:9 | 1:1.
# Собрать пример: videoforge resource gen-example caption_style cartoon_bangers
preview_format: "9:16"
font: "Bangers"  # имя семейства внутри файла шрифта
font_file: Bangers-Regular.ttf  # файл в assets/fonts/ (OFL)
size_pct: 8.6  # кегль, % короткой стороны кадра (8.6 → 93 px при 1080): одно слово, читается с полутора метров
bold: false  # у шрифта один вес
uppercase: true
color: "#FFE600"  # верх буквы; низ — gradient_to
highlight: "#FFE600"  # равен color: слово на экране одно, подсвечивать нечего
gradient_to: "#FF6A00"  # жёлтый в оранжевый, как у erickerhead (замер 19.09.2026)
                              # ("#FF7A00" — жёлтый в оранжевый). Считается по одной
                              # строке: таким стилям ставят max_words 1–2. Пусто — ровно
strip_punctuation: true       # одно слово на экране — знаки на краях не нужны
outline_color: "#2A1000"  #000000"
outline: 6.0  # обводка, px при 1080: толстая, мультяшная
shadow: 0.0                  # ВТОРАЯ копия текста со смещением, а не размытие:
                              # поверх обводки читается как второй субтитр
box_opacity: 0.0              # подложка под репликой: 0 — нет, 0.6 — тёмное стекло.
                              # Спасает белый текст на белой футболке; обводки у
                              # текста тогда нет, outline — поля подложки
box_color: "#000000"
position: bottom              # слово поверх картинки, в нижней трети: лица выше, блок площадки ниже
margin_pct: 30.0              # отступ от низа, % высоты: у erickerhead слово на 56%, у нас ниже — не по лицам
                              # под вертикальные соцсети: интерфейс закрывает
                              # до 17% снизу. Горизонтали хватит 10–12%
side_margin_pct: 6.0          # отступ от боков, % ширины — по нему переносятся строки
max_words: 1  # одно слово на экране — градиент считается по одной строке
max_chars: 14  # символов в реплике
max_gap_sec: 0.55             # пауза в речи длиннее этого начинает новую реплику
mode: phrase  # karaoke — подсветка текущего слова; phrase — фраза целиком
fade_ms: 60                   # появление/исчезание реплики
emphasis_color: "#FF5A36"     # слова-акценты (их выбирает монтаж)
emphasis_scale: 112           # % кегля для акцентов
# Плашки (Scene.overlay): вывод реплики, источник «Коран 55:15», ярлык «ПУНКТ 3».
# Тот же шрифт и цвета, что у субтитров, всегда сверху; ключевое слово — цветом highlight
overlay_size_pct: 3.6         # кегль плашки, % короткой стороны
overlay_margin_pct: 5.0       # отступ от верхнего края, % высоты
overlay_box_opacity: 0.6      # тёмное стекло под текстом; 0 — обводка вместо подложки
overlay_box_color: "#000000"
# Как реплика оживает:
#   none   — строка стоит, произносимое слово перекрашивается
#   pop    — произносимое слово подпрыгивает пружиной
#   reveal — слова проявляются по очереди на своих местах: реплика разложена
#            заранее, каждое слово выезжает снизу, текст не двигается
#   grow   — то же появление, но на экране только произнесённые слова: строка
#            растёт и встаёт по центру заново, сдвигая прежние
# Кроме none, на каждое слово приходится своя реплика ASS — так устроены теги
# \t и \move; файл субтитров длиннее, на рендер это не влияет
animation: pop  # слово подпрыгивает пружиной
reveal_ms: 220                # reveal/grow: появление слова целиком (подъём + проявление)
reveal_rise_pct: 35           # reveal/grow: откуда слово едет, % кегля ниже своего места
