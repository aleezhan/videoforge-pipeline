# Субтитры для соцсетей: шортсы, рилсы, TikTok. Слова проявляются по очереди
# на своих местах — реплика разложена заранее, каждое слово выезжает снизу и
# проявляется, уже написанное не двигается. Белый текст, жёлтая подсветка
# произносимого слова, плакатный Russo One заглавными.
#
# На языке речи подсветка идёт по слову (тайминги из .srt). На переведённых
# субтитрах (video.captions_language ≠ языка речи) слова появляются по длине
# внутри измеренного окна реплики, и жёлтым горит последнее появившееся —
# «его произносят сейчас» о переводе знать нельзя, «оно только что пришло» —
# можно.
#
# Подложки нет намеренно (box_opacity 0). QA меряет контраст текста к фону и
# на светлой футболке говорит «2.9:1, читается, но впритык» — это совет, а не
# дефект: замер не видит обводку, а она тут 5 px и держит белый текст. Смотрели
# готовый ролик на телефоне 09.09.2026: без подложки читается, с подложкой
# полоса выглядит грубо. Нужна она там, где обводки действительно не хватает —
# приём library/caption_color/dark_plate.
# Стиль субтитров — ресурс. Подключается строкой resources.caption_style: social_shorts
# Тайминги слов приходят из озвучки (edge-tts), стиль их только рисует.
# Цвета — "#RRGGBB". Шрифты лежат в videoforge/assets/fonts/ (OFL, с кириллицей):
#   PT Sans      → PTSans-Bold.ttf        спокойный, читается мелким
#   Russo One    → RussoOne-Regular.ttf   тяжёлый плакатный, для шортсов
# Свой шрифт: положи .ttf рядом и укажи имя семейства и файл.
id: social_shorts
name: "Субтитры для соцсетей"
# Приёмы библиотеки, из которых собран стиль: "<точка>/<id>". Происхождение, а
# не исполнение — пульт покажет, что выбрано и почему (условия и замеры лежат у
# приёма), и на странице приёма — где он уже применён.
#   videoforge lib list caption_font | caption_color | caption_animation | captions
techniques:
  - captions/social_captions
  - caption_font/russo_one
  - caption_color/white_yellow
  - caption_animation/words_in_place
# В каком формате показывать пример стиля в пульте: 9:16 | 16:9 | 1:1.
# Собрать пример: videoforge resource gen-example caption_style social_shorts
preview_format: "9:16"
font: "Russo One"             # имя семейства внутри файла шрифта
font_file: RussoOne-Regular.ttf  # файл в assets/fonts/ или абсолютный путь
size_pct: 6.5                 # кегль, % короткой стороны кадра (6.5 → 70 px при 1080)
bold: false                   # у Russo One один вес — жирнить нечего
uppercase: true               # плакатный шрифт читается заглавными
color: "#FFFFFF"              # ещё не произнесённые слова
highlight: "#FFD400"          # произносимое слово; равен color — без подсветки
outline_color: "#000000"
outline: 5.0                  # обводка, px при 1080. 5 вместо 3: QA на шортсах
                              # podcast_clips ловил белый текст на белой футболке
shadow: 0.0                  # ВТОРАЯ копия текста со смещением, а не размытие:
                              # поверх обводки читается как второй субтитр
box_opacity: 0.0              # подложка под репликой: 0 — нет, 0.6 — тёмное стекло.
                              # Спасает белый текст на белой футболке; обводки у
                              # текста тогда нет, outline — поля подложки
box_color: "#000000"
position: bottom              # bottom | center | top
margin_pct: 22.0              # отступ от края по вертикали, % высоты. 22% —
                              # под вертикальные соцсети: интерфейс закрывает
                              # до 17% снизу. Горизонтали хватит 10–12%
side_margin_pct: 15.0         # отступ от боков, % ширины — по нему переносятся строки.
                              # 15%, а не 6: справа колонка кнопок площадки
                              # (YouTube Shorts и TikTok 15%, Reels 14% — QA считает)
max_words: 4                  # слов в одной реплике (замер yuka_mma: 3–6 слов)
max_chars: 20                 # символов в реплике — короче строка, дальше от кнопок
max_gap_sec: 0.5              # пауза в речи длиннее этого начинает новую реплику
mode: karaoke                 # karaoke — подсветка текущего слова; phrase — фраза целиком
fade_ms: 40                   # только на уход реплики: приход рисует сама анимация
emphasis_color: "#FF3B3B"     # слова-акценты (их выбирает монтаж)
emphasis_scale: 118           # % кегля для акцентов
# Плашки (Scene.overlay): вывод реплики, источник «Коран 55:15», ярлык «ПУНКТ 3».
# Тот же шрифт и цвета, что у субтитров, всегда сверху; ключевое слово — цветом highlight
overlay_size_pct: 3.6         # кегль плашки, % короткой стороны
overlay_margin_pct: 5.0       # отступ от верхнего края, % высоты
overlay_box_opacity: 0.6      # тёмное стекло под текстом; 0 — обводка вместо подложки
overlay_box_color: "#000000"
# Как реплика оживает:
#   none   — строка стоит, произносимое слово перекрашивается
#   pop    — произносимое слово подпрыгивает пружиной
#   reveal — слова проявляются по очереди на своих местах: реплика разложена
#            заранее, каждое слово выезжает снизу, текст не двигается
#   grow   — то же появление, но на экране только произнесённые слова: строка
#            растёт и встаёт по центру заново, сдвигая прежние
# Кроме none, на каждое слово приходится своя реплика ASS — так устроены теги
# \t и \move; файл субтитров длиннее, на рендер это не влияет
animation: reveal             # слова проявляются на своих местах, текст не двигается
reveal_ms: 220                # reveal/grow: появление слова целиком (подъём + проявление)
reveal_rise_pct: 35           # reveal/grow: откуда слово едет, % кегля ниже своего места
