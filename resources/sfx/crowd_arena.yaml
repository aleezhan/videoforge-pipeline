# Непрерывный гул арены — ПЕТЛЯ под всю дорожку, а не точечный акцент.
# Ради него звук и взят: у ИИ-ролика между репликами цифровая тишина (в ep001
# замерено −91 дБ в паузах, 267 с из 506), и закрывает её только непрерывная
# подложка. Приём: library/audio_layers/ambient_bed.yaml.
#
# Как сделан из исходника: кусок 3–17 с (самый ровный участок, RMS −17.6…−19.9
# дБ по секундам), потом хвост 1.5 с наложен кроссфейдом на начало
# (acrossfade) — конец переходит в начало тем же материалом, поэтому петля
# играет без стыка. Уровни первой и последней секунды сходятся на 1.7 дБ.
# Пик выровнен на −6 дБ: это фон, он тише одиночных ударов библиотеки (−3.5).
#
# ЛИЦЕНЗИЯ: CC0 1.0 — общественное достояние, упоминание автора НЕ требуется,
# коммерческое использование и монетизация разрешены. Автор всё равно назван
# ниже: это вежливость и след, по которому можно вернуться к исходнику.
# Файл получен как hq-превью freesound (mp3 128 кбит/с): оригинал отдают
# только залогиненным, превью — всем. Для фона на −20 дБ этого достаточно;
# если звук выйдет на первый план, оригинал надо докачать из аккаунта.
id: crowd_arena
techniques:
  - audio_layers/ambient_bed
name: "Гул арены (петля)"
file: crowd_arena.wav
license: "CC0 1.0 (https://creativecommons.org/publicdomain/zero/1.0/) — атрибуция не требуется, коммерция разрешена"
source: "https://freesound.org/people/benfree/sounds/130568/ («RoaringCrowd.wav», автор benfree), CC0; скачано 09.09.2026, обрезано и склеено в петлю"
kind: other
duration_sec: 12.5
gain_db: -20    # относительно голоса: фон, а не событие. Замер: подложка на
                # −20 дБ убирает тишину полностью, на −26 остаётся 4.6 с,
                # на −38 не меняет ничего (см. evidence приёма ambient_bed)
tags: [ambience, loop, crowd, arena, sport, bed]
