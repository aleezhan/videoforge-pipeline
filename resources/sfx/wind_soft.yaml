# Мягкий свежий ветер, 8 с: вход 2.5 с, выход 3 с, без свиста и завываний.
# Для «в тесноту входит свежий ветер из открытой двери в Рай».
#
# Как сделан: настоящая запись лёгкого ветра на холмах, кусок 10–18 с; гул
# задувания в микрофон снят (highpass 260 Гц), воздух чуть поднят (+5 дБ от
# 3 кГц), уровень медленно дышит ±20%. Запись очень тихая (пик −33 дБ),
# поднята на ~30 дБ — на первом плане может быть слышно сжатие mp3; для
# слоя под голосом этого хватает.
#
# ЛИЦЕНЗИЯ: CC0 1.0 — атрибуция не требуется, коммерция разрешена.
# Файл — hq-превью freesound (mp3 128 кбит/с); оригинал отдают залогиненным.
# Рецепт сборки и исходник: resources/sfx/_src/build_grave_sfx.py, картинка
# волны и спектра: resources/sfx/_preview/wind_soft.png. Пик −3 dBFS, 48 кГц стерео.
