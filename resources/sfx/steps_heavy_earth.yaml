# Четыре медленных тяжёлых шага по земле, приближаются: каждый следующий громче
# и ярче, интервалы 1.22 / 1.18 / 1.23 с (шаги на 0.20, 1.42, 2.60, 3.83 с).
# Ставить так, чтобы последний шаг (3.83 с от начала звука) попал на появление
# ангелов в кадре. Без музыки и инструментов: запись шагов + низкий удар.
#
# Как сделан: четыре настоящих шага по земле и сухим листьям, каждый замедлен
# в 0.7 раза (тяжелее и ниже), под каждым синтезированный низ 42–92 Гц со
# второй гармоникой (чтобы удар не пропал на динамике телефона), короткие
# плотные отражения (37–167 мс) — подземелье.
#
# ЛИЦЕНЗИЯ записи: CC0 1.0 — атрибуция не требуется, коммерция разрешена.
# Файл — hq-превью freesound (mp3 128 кбит/с); оригинал отдают залогиненным.
# Рецепт сборки и исходник: resources/sfx/_src/build_grave_sfx.py, картинка
# волны и спектра: resources/sfx/_preview/steps_heavy_earth.png. Пик −3 dBFS, 48 кГц стерео.
