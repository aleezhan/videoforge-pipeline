# Персонаж — ресурс. Подключается к проекту строкой resources.character: amir
# Код про персонажа не знает: всё, что он есть, — этот файл и папка-портфолио.
#
# Персонаж — это лицо, тело и характер. Одежда, обувь, предметы и «что должно
# быть в кадре» — свойства сцены/эпизода, здесь их НЕ описывать.
id: amir
name: "Амир"

# Кто это по-русски: возраст, роль, характер. Для сценариев и для людей.
description: "Мужчина около 35 лет, практикующий мусульманин с аккуратной полной бородой, обычный человек из аудитории — не учёный и не имам. Сквозной герой эпизодов: рассказчик говорит за кадром, а Амир проживает то, о чём речь, — молится, сомневается, ошибается, кается, стоит на весах, отвечает в могиле; каждый пункт списка показан сценой с ним. В кадре не говорит (озвучка закадровая, липсинк не нужен), эмоцию передаёт лицом и позой: ладонь на сердце, раскрытые ладони дуа, опущенная голова, поднятые брови. Семейный, мягкий, без карикатуры. Одежда всегда задаётся сценой: дома — куфи и рубашка, в мечети — белая тоба, на работе — костюм."

# «Паспорт» — вставляется в каждый visual_prompt. По-английски и коротко:
# возраст, телосложение, цвет волос/глаз/кожи и 2–3 стабильные приметы (шрам,
# необычный цвет глаз, фирменная деталь) — персонажа с приметами любая модель
# держит лучше «обычного человека». Лицо держат референсы из портфолио;
# паспорт страхует внешность при смене модели и задаёт самую первую генерацию.
prompt_block: "adult man around 35, medium athletic build, warm olive skin, short neatly trimmed full black beard with a few gray strands at the chin, short black hair, dark brown eyes, thick straight black eyebrows, small dark mole under the left eye, calm expressive face"

# Портфолио: …/characters/amir/. Кадры из КОРНЯ папки идут референсами в каждую
# сцену — держи там ядро из ~7 кадров одного и того же лица, имена файлов по
# содержимому: face_front, face_three_quarter, face_profile, body_full_front,
# body_full_back, body_waist_up, face_expression_smile. Образы и архив — в
# подпапках (looks/, archive/): они НЕ подхватываются автоматически.
# Сгенерировать ядро: videoforge resource gen-portfolio character amir --style flat_cartoon_warm
# (платно, нужен GEMINI_API_KEY; сид-лицо выбирает пользователь — см. /new-character)
# Явный список ниже нужен, только чтобы выбрать конкретные кадры вручную.
reference_images: []

# Обученные веса для художника на своей карте (ComfyUI, klein 4B). С ними промпт
# идёт без паспорта: триггер + стиль + сцена. Файл — относительно папки characters/.
lora:
  file: amir/lora/amir_klein4b_v2.safetensors
  trigger: amir
  base: klein4b
  strength: 1.0
#  - amir/face_front.png

# Что проверяющая модель сверяет на каждом кадре: только идентичность.
# Одежду НЕ проверять — она меняется от сцены к сцене и задаётся сценой.
checklist:
  - "Лицо, полная чёрная борода и цвет глаз соответствуют референсам"
  - "Возраст читается как ~35 лет"
  - "Приметы на месте: родинка под левым глазом (справа от носа, если смотреть на кадр), густые прямые брови, седые пряди на подбородке"
  - "Ровно один Амир в кадре, без дублей и двойников"
