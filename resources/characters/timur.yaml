# Персонаж — ресурс. Код про него не знает: заменить, добавить, удалить — правкой YAML.
# ПОДСТРОИТЬ под реальные референсы: описание ниже — заготовка без примет.
id: timur
name: Тимур
description: Мальчик лет восьми, главный герой коротких приключенческих историй.

# «Паспорт»: только идентичность (возраст, телосложение, цвета, приметы).
# Одежда и предметы — свойства сцены, здесь их нет: гардероб задаёт эпизод.
prompt_block: >
  Timur, an 8-year-old boy with short dark hair, big brown eyes and a slim build

# Ядро портфолио — кадры в resources/characters/timur/ (корень папки, имена по
# содержимому: face_front, body_full_front…). Сгенерировать:
#   videoforge resource gen-portfolio character timur --style pixar3d
reference_images: []

# Только идентичность: одежду не проверять, она меняется от сцены к сцене.
checklist:
  - Лицо и причёска соответствуют референсам (короткие тёмные волосы, большие карие глаза)
  - Возраст читается как ребёнок ~8 лет, не подросток и не взрослый
  - Один персонаж, без дублей и лишних людей, если сцена их не предполагает
