# Место (локация) — визуальный ресурс: должно выглядеть одинаково во всех
# эпизодах. Указывается в касте сцены: cast: ["locations/treehouse", ...]
id: treehouse
name: "Домик на дереве"

# Что это за место по-русски: для сценариев и для людей.
description: "Секретный домик на дереве, построенный дедушкой в чаще леса. Найден в эпизоде ep001_treehouse; дальше — база приключений Тимура."

# Вставляется в промпт картинки, когда место в касте сцены. По-английски и
# конкретно: что это, из чего, какие узнаваемые детали, освещение по умолчанию.
# Например: "grandpa's wooden house interior, log walls, a round table by the
# window, an old green armchair, warm lamp light"
prompt_block: "a cozy small treehouse built of weathered dark wooden planks high in a big old tree, hidden among thick green branches, a rope ladder hanging down, a small door with a carved X mark, sloped plank roof, warm sunlight through the leaves"

# Портфолио: положи 1–4 картинки в папку рядом — resources/…/locations/treehouse/ —
# они подхватятся автоматически. Явный список ниже нужен, только если хочешь
# выбрать конкретные кадры из папки.
reference_images: []

# Что проверяющая модель сверяет, когда место в кадре.
checklist:
  - "Домик из потемневших деревянных досок на большом старом дереве, скрыт в густых ветвях — как на референсе"
  - "Есть верёвочная лестница вниз и маленькая дверца с вырезанным крестиком"
  - "Нет надписей, стеклянных окон, техники и посторонних людей"
