# Предмет — визуальный ресурс: фишка, которая должна выглядеть одинаково во
# всех эпизодах. Указывается в касте сцены: cast: ["props/map", ...]
id: map
name: "Дедушкина карта"

# Что это по-русски и почему важно (фишка героя, магический предмет…).
description: "Старая карта, оставленная дедушкой: ведёт Тимура к секретным местам и двигает сюжеты серии. Появилась в «Карте дедушки», в ep001_treehouse привела к домику на дереве."

# Вставляется в промпт картинки, когда предмет в касте сцены. По-английски и
# конкретно: форма, размер, цвета, материал, узнаваемые детали.
# Например: "an old brass pocket compass with a cracked glass lid and a red
# needle, worn leather strap"
prompt_block: "an old yellowed hand-drawn paper map, folded into quarters, worn creases and frayed edges, hand-drawn forest, winding paths and a small river, a red pencil X mark, no readable text or letters"

# Портфолио: положи 1–2 картинки в папку рядом — resources/…/props/map/ —
# они подхватятся автоматически. Явный список ниже — только чтобы выбрать
# конкретные кадры из папки.
reference_images: []

# Что проверяющая модель сверяет, когда предмет в кадре.
checklist:
  - "Карта бумажная, пожелтевшая, с потёртыми сгибами и обтрёпанными краями — как на референсе"
  - "На карте нарисованные от руки лес, тропинки, речка и красный крестик"
  - "На карте нет читаемого текста и букв"
