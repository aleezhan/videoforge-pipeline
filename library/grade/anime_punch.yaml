id: anime_punch
decision: grade
title: Сочная
summary: тени в ноль, света чуть вверх, середина не тронута, насыщенность +8%
status: implemented

always: false
applies_when:
  footage: [animation]
never_when: {}

# Форма приёма, а не кривая. Саму кривую подгоняют под конкретный релиз и
# кладут в папку эпизода: у разных рипов одного аниме разный чёрный.
params:
  shadows_to: [0, 3]        # куда опустить 1-й перцентиль яркости
  highlights_to: [246, 252] # куда поднять 99-й
  midtones: "не трогать"
  saturation_after_curve: 1.08

implemented_by: "ffmpeg curves + eq=saturation, применяется ДО наложения текста"

evidence:
  - source: "reference reel против исходного релиза 15-й серии Re:Zero S4"
    measured: "тени 18.4 → 1.3, света 239.9 → 249.6, контраст x1.10, насыщенность 0.405 → 0.499"
    date: "2026-09-05"
    verdict: works

notes: >-
  Диагностический признак, что коррекция нужна: чёрный в кадре стоит не на
  нуле, а на 15-20 — глаз читает это как серую пелену по всей картинке, и
  пользователь называет ролик «сероватым». Метод подгонки: сравнить перцентили
  яркости эталона и исходника на 10+ кадрах, исключив полосу с текстом.
  ЛОВУШКА: насыщенность нельзя брать из сравнения «исходник против эталона» —
  сама кривая её поднимает, и коэффициент посчитается дважды (получилось 1.21
  вместо 1.08). Подгонять остаток НА ВЫХОДЕ кривой.
