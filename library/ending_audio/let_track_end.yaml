notes: >-
  Приём-антипод к fade_out_soft и выбирается не условиями ролика, а тем, чем
  кончается кусок трека. Признак: последняя секунда уходит в тишину сама
  (разрешённый аккорд, спад), тогда искусственное затухание слышно как обрыв.
  Меряется тем же способом, что и у эталона: относительный уровень по шагам
  0.1 с на последней секунде.
