id: fade_out_soft
decision: ending_audio
title: Плавное затухание
summary: последние 0.4-0.6 с уровень уходит в ноль, картинка при этом не темнеет
status: implemented

# Нарезка из трека почти всегда обрывается посреди фразы — там затухание и нужно.
always: false
applies_when:
  music: true
never_when: {}

params:
  length_sec: 0.5
  range_sec: [0.3, 0.6]
  video_fades: false

implemented_by: "assemble — fade_out_sec в project.yaml (дефолт 0.8) или в плане монтажа"

evidence:
  - source: "reference reel, 19k likes, аниме-эдит 26 с"
    measured: "относительный уровень по шагам 0.1 с: 1.31 → 0.66 → 0.41 → 0.22 → 0.04 → 0"
    date: "2026-09-05"
    verdict: works

notes: >-
  Ставить ПОСЛЕ loudnorm: нормализатор частично выравнивает затухание обратно.
  Дефолт проекта 0.8 с рассчитан на озвученный эпизод, который заодно
  затемняется в чёрное; короткому ролику на музыке хватает 0.5 без затемнения.
  Проверять сравнением: если у соседних приёмов этой точки условия совпали,
  решает то, чем кончается сам трек.
