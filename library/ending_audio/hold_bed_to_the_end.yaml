id: hold_bed_to_the_end
decision: ending_audio
title: Фон держится до последнего кадра
summary: после последней реплики дорожка не проваливается в тишину, а несёт фон до конца и уходит затуханием — иначе ролик кончается за пятнадцать секунд до конца файла
status: implemented

always: false
applies_when:
  has_speech: true
never_when: {}

params:
  fade_out_sec: 0.8
  max_silent_tail_sec: 1.0  # больше секунды немого хвоста — это уже дефект

implemented_by: "assemble — music-ресурс с loop_ok: true плюс fade_out_sec проекта; длину хвоста показывает measure_final"

evidence:
  - source: "doc_channel/ep001, готовый final.mp4, 506.6 с"
    measured: "последний кусок тишины 490.0–505.6 с: 15.6 с подряд без единого звука при уровне −91.0 дБ, то есть 3% хронометража ролик уже кончился, а файл ещё идёт"
    date: "2026-09-09"
    verdict: failed
  - source: "тот же ролик, кусок с подложкой на −20 дБ к голосу"
    measured: "тишина на всём куске 0.0 с — фон доходит до края, затухание срезает его за 0.8 с"
    date: "2026-09-09"
    verdict: works

notes: >-
  Это не про красоту, а про то, что немой хвост читается как поломка файла:
  зритель видит бегущий таймлайн и не слышит ничего, и первая мысль — «звук
  отвалился», а вторая — закрыть.
  Приём соседствует с fade_out_soft, а не спорит с ним: тот про ФОРМУ
  затухания, этот про то, что затухать должно быть чему. Проверять замером
  хвоста: measure_final даёт список кусков тишины, последний из них и есть
  ответ. Порог max_silent_tail_sec взят как «секунда паузы после точки» —
  измеренного обоснования у него пока нет, это соглашение.
