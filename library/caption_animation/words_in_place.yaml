id: words_in_place
decision: caption_animation
title: Слова на своих местах
summary: реплика разложена заранее, слова проявляются по очереди на своих местах — каждое выезжает снизу, текст не двигается

always: false
applies_when:
  has_speech: true
never_when: {}

status: implemented

params:
  animation: reveal           # в стиле субтитров
  reveal_ms: 220              # появление слова целиком: подъём + проявление
  reveal_rise_pct: 35         # откуда слово едет: % кегля ниже своего места

implemented_by: "caption_styles/<id>.yaml: animation: reveal → core/captions._reveal_dialogues (реплика ASS на слово, теги \\move и \\alpha)"

evidence:
  - source: "витрина приёма library/caption_animation/words_in_place/after.mp4 (1280×720, Russo One 6%)"
    measured: "покадрово при 25 к/с: левый край текста стоит на 270 px все 75 кадров реплики — слова прибывают, строка не двигается"
    date: "2026-09-09"
    verdict: works
  - source: "шортсы podcast_clips/src01_h08 и _h19 (английские субтитры поверх русской речи)"
    measured: "на переводе слова появляются по длине внутри измеренного окна реплики: строка набирается в такт говорящему, подсветка отключена — какое слово перевода звучит сейчас, неизвестно"
    date: "2026-09-09"
    verdict: works
  - source: "первая версия: слово передавалось от поднимающейся реплики к осевшей"
    measured: "на стыке слово пропадало на кадр — 0 пикселей текста на 0.52 с (25 к/с); время реплики ASS округлено до сотых, стык не совпадает с кадром"
    date: "2026-09-09"
    verdict: failed

notes: >-
  Стиль, который его берёт: `resources/caption_styles/social_shorts`.
  Разница с приёмом «Строка растёт» (`line_grows`) — только в том, из чего
  состоит строка: здесь реплика разложена целиком с первого кадра, будущие
  слова спрятаны в прозрачность и держат место. Первое слово поэтому стоит не
  по центру кадра, а там, где ему быть в готовой строке.
  Как и у `pop`, на каждое слово приходится своя реплика ASS, плюс две на
  подъём — файл субтитров в 5–6 раз длиннее обычного, libass это переваривает.
