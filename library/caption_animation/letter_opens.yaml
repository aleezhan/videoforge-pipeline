id: letter_opens
decision: caption_animation
title: Буква раскрывается в кадр
summary: слова первой строки песни идут маской по вокалу, последнее — короткое — растёт, не теряя формы, пока не накроет экран, и за ним открывается видео

always: false
applies_when:
  aspect: "9:16"
never_when:
  has_speech: true            # приём для интро под музыку; поверх озвучки текст живёт по своим правилам

status: implemented

params:
  text: "первая строка песни"  # НЕ выдуманная фраза: на экране то, что поют
  glyph: "последнее слово строки"  # приём работает, когда оно в один-два символа
  grow_sec: 2.5               # сколько длится раскрытие
  easing: "u**2.2"            # ease-IN: буква держит форму, потом распахивается
  land_on: "музыкальное событие"  # конец роста сажают на вход барабанов или дроп

implemented_by: >-
  Вне конвейера, ffmpeg + Pillow: маска кадр за кадром (белый текст на чёрном),
  видео под неё через alphamerge и overlay на чёрный фон. Рабочий образец —
  projects/tests/episodes/t04_beat_text_edit/masks.py и build.py.

evidence:
  - source: "projects/tests/episodes/t04_beat_text_edit (эталон — чужой рилс, повтор приёма)"
    measured: >-
      буква Russo One «I» после сжатия 0.66 — 77×213 px на кадре 1080×1920.
      При равномерном увеличении высота уходит за кадр на ×9.0, а ширина
      накрывает его только на ×14.0: последние 5 кадров роста и читаются как
      расширяющаяся полоса, хотя масштабируется целая буква
    date: "2026-09-09"
    verdict: works
  - source: "первая сборка того же ролика"
    measured: >-
      вместо буквы рос ПРЯМОУГОЛЬНИК от её рамки до кадра — форма подменялась на
      первом же кадре роста, и приём читался как «буква мигнула и стала бруском»
    date: "2026-09-09"
    verdict: failed
  - source: "та же сборка, подбор easing"
    measured: >-
      ease-out (1-(1-u)^3) даёт 12% роста за первый кадр — буква пропадает
      раньше, чем её успевают прочитать
    date: "2026-09-09"
    verdict: failed
  - source: "тот же ролик, третья сборка: слова из текста песни, времена со своего звука"
    measured: >-
      слова взяты из текста песни и поданы распознавалке подсказкой, времена
      сняты с того самого mp3, что звучит в ролике. Что времена остались
      измеренными, а не подогнанными под подсказку, видно по опорным словам:
      rodeo 14.80 → 14.82, control 17.02 → 17.00, vulnerable 18.76 → 18.76 —
      сдвиг меньше трёх сотых. Первое слово после входа барабанов 10.13 → 9.96,
      «deeper» 14.47 → 11.86. Интро было 8 слов, начинавшихся с фразы, которой
      в этом куске не поют вовсе, стало 4 слова на своих секундах.
      Раскрывающееся слово держится НОТОЙ 3.36 → 7.00 при входе барабанов на
      9.706 — растущая буква ложится на удержанную ноту, и это и есть причина,
      по которой приём читается
    date: "2026-09-10"
    verdict: works
  - source: "тот же ролик, слова против вокала"
    measured: >-
      файл слов оказался от ДРУГОЙ записи: последняя реплика 219.6 с при треке
      213.7 с. Слова на экране опаздывали за вокалом примерно на 3 с, а сверка
      этого не показывала — текст на экране и «слова песни» в пульте росли из
      одного файла и совпадали всегда. Механика роста при этом верна
    date: "2026-09-10"
    verdict: failed

  - source: "проверка подбора роста на других словах, не только на образце"
    measured: >-
      рост шёл из середины РАМКИ глифа, а у буквы с дырой середина пустая:
      «ВСЁ», «СНОВА» и «О» не открывали кадр НИ НА КАКОМ масштабе до предела —
      максимум доли белого 0.47–0.55, дальше падение до нуля, потому что кадр
      целиком проваливается внутрь кольца. grow_to_full при этом возвращал 256
      при собственном пределе 200, и рендер послушно растил букву до ЧЁРНОГО
      экрана. Приём жил ровно потому, что в образце последним словом была «I»,
      у которой середина залита — совпадение, а не свойство приёма
    date: "2026-09-11"
    verdict: failed
  - source: "тот же подбор, рост из сердцевины штриха"
    measured: >-
      точка роста — не середина рамки и не любая краска рядом с ней, а
      сердцевина штриха (стачивание слоями до последнего уцелевшего). Точка у
      КРАЯ штриха открывает кадр только на 0.926 даже на пределе: с той стороны,
      где край, чёрное поспевает за ростом и достаёт до углов. Из сердцевины
      открываются все шесть проверенных слов (ЛЮБОВЬ, ВСЁ, СНОВА, О, I, Я), и
      нужный масштаб падает в разы: «СНОВА» 200 → 30.7, «О» 200 → 19.6, то есть
      рендер перестаёт ворочать промежуточные картинки в сотни тысяч пикселей
    date: "2026-09-11"
    verdict: works

notes: >-
  РАСТИТЬ НАДО ИЗ СЕРДЦЕВИНЫ ШТРИХА, а не из середины рамки буквы. У «О», «В»,
  «Ь» середина рамки — дыра, и рост «по центру» не открывает кадр никогда:
  сначала видно кольцо, потом экран проваливается внутрь него. Точку ищет
  `core/textmask.open_anchor` стачиванием слоёв; буква к ней уходит тем же
  easing, что и растёт, иначе на первом кадре анимации она прыгает.

  Текст берётся из песни, а не сочиняется. Первая сборка вписала выдуманную
  фразу под удары — технически ровно, но связи с музыкой не было, и приём не
  читался: в эталоне на экране первая строка песни, и раскрывающаяся буква —
  её последнее слово. Слова с пословными таймингами берут из .vtt рядом с
  треком (разбор — projects/tests/episodes/t04_beat_text_edit/lyrics.py).

  РАБОЧИЙ СПОСОБ: слова из текста песни, времена со своего звука. Текст берут
  готовым (сайт с текстами, LRCLIB — без ключа), а секунды снимают
  распознаванием по тому файлу, который звучит в ролике
  (`videoforge resource gen-lyrics`), подав текст подсказкой. Тогда модель
  перестаёт выдумывать слова, а времена остаются измеренными. Наоборот — брать
  и слова, и времена из чужого файла — не работает: у живого выступления та же
  строка звучит в другую секунду, чем в студийном релизе или другой загрузке.

  ФАЙЛ СЛОВ ОБЯЗАН БЫТЬ ОТ ТОЙ ЖЕ ЗАПИСИ, что и звук. В образце он был от
  другой (последняя реплика 219.6 с при треке 213.7 с — субтитры не бывают
  длиннее своего ролика), и слова на экране опаздывали за вокалом на ~3 с при
  идеальной механике роста. Проверяется бесплатно и python-ом:
  `core/captions.lyrics_problems` — длина файла против длины трека плюс пометки
  распознавалки; видно в `videoforge resource show music <id>`.

  Машинная расшифровка живого вокала вдобавок глотает слова («feel like I'm on
  a rodeo» → «feel like on Rodeo»). Для приёма, где слово растёт в кадр, это
  решает: растёт не то слово.

  Растить надо САМУ БУКВУ — масштабировать её маску, а не рисовать прямоугольник
  по её рамке. Это единственное, что отличает приём от простого открывания
  шторки: пока буква крупнее экрана лишь по высоте, зритель ещё видит засечки и
  понимает, что раскрывается именно буква.

  Под маской нужен СВЕТЛЫЙ и ДЛИННЫЙ клип. Ночной кадр (средняя яркость 17 из
  255) даёт чёрные буквы на чёрном фоне — текст не читается вовсе; на дождливой
  улице (125) читается. Длина: интро на 9.7 с — это 291 кадр, короткие клипы
  его не покрывают.

  Конец роста сажают на музыкальное событие: в образце — вход барабанов на
  9.706 с, найденный по реальным ударам, а не по вычисленной сетке долей.
