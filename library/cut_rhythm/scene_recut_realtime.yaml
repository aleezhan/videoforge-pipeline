id: scene_recut_realtime
decision: cut_rhythm
title: Сцена без провалов
summary: берём непрерывный кусок исходника целиком, вынимаем 2-3 паузы, скорость не трогаем
status: implemented

always: false
applies_when:
  footage: [animation, filmed]
never_when: {}

params:
  cuts_per_30s: [2, 4]
  speed: 1.0

implemented_by: "резка отрезков из одной сцены + concat"

evidence:
  - source: "reference reel, 26 с, 19k лайков"
    measured: "склеек ровно 3, отрезков 4, скорость x1.00, исходником объяснено 100% кадров; вырезано 0.44 с и 1.74 с, хвост взят на 18 с позже"
    date: "2026-09-05"
    verdict: works

notes: >-
  Открытие разбора: ролик, который кажется быстрым и рваным, может не иметь
  почти никакого монтажа — скорость создаёт сама анимация. Не выдумывать
  нарезку там, где материал уже динамичен.
  ЛОВУШКА измерения: detect_cuts на аниме врёт в разы (43 «склейки» при пороге
  0.3, 16 при 0.45, на деле 3). Монтаж чужого ролика считать сопоставлением
  кадров с исходником, а не детектором смен картинки.
