id: difference_blend
decision: caption_color
title: Цвет из кадра (разность)
summary: буквы не красятся своим цветом, а берут обратный цвет того, что под ними — слово выглядит вырезанным из картинки
status: implemented

always: false
applies_when:
  format: [anime_edit]
never_when:
  has_speech: true

params:
  layer_color: "тёплый светлый, НЕ белый"   # цвет слоя до разности; белый над тёплым фоном даёт синие буквы
  opacity: 1.0
  blend: difference

implemented_by: "ffmpeg: слой drawtext по чёрному + blend=all_mode=difference в RGB (format=gbrp)"

evidence:
  - source: "reference reel, 19k likes"
    measured: "плотность букв 0.945/0.992/1.000 над небом и песком; под словом однотонное поле"
    date: "2026-09-05"
    verdict: works
  - source: "эдит «боль» из Re:Zero S4 серия 14: крупные планы лиц вместо неба и пустыни"
    measured: >-
      слой (255,220,168) над розовыми волосами (~250,160,190) даёт разность
      (5,60,22) — ядовито-зелёные буквы поперёк лица. Заменено на кремовую
      надпись обычным наложением (cream_on_glass) + smart_placement.
    date: "2026-09-05"
    verdict: failed

notes: >-
  ГРАНИЦА: годится, когда под словом однотонное крупное поле — небо, песок,
  стена, темнота. По пёстрому фону и по лицу крупным планом разность даёт
  случайный цвет букв и читается как дефект. Три ловушки, каждая стоила прогона:
  считать в RGB (в YUV «чёрный» это Y=16, и разность уводит кадр в зелень);
  слой не белый (с белым над тёплым фоном буквы синие, у эталона они почти
  чёрные); мерить ширину слова и высоту буквы раздельно.
