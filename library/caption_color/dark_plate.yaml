id: dark_plate
decision: caption_color
title: Тёмная подложка под текстом
summary: полупрозрачный тёмный прямоугольник под репликой вместо обводки — текст читается на любом фоне, включая светлый

always: false
applies_when:
  footage: filmed             # снятый материал: фон непредсказуем, в отличие от рисованного кадра
never_when: {}

status: implemented

params:
  box_opacity: 0.6            # 0 — нет подложки; 0.6 — сквозь неё кадр ещё виден
  box_color: "#000000"
  outline: 5.0                # с подложкой обводки нет: outline — её поля

implemented_by: "caption_styles/<id>.yaml: box_opacity > 0 → ASS BorderStyle 3 (core/captions._style_line)"

evidence:
  - source: "первый шортс smol_clips, QA 05.09.2026"
    measured: "белый текст на белой футболке назван нечитаемым на 4 кадрах из 4 — с этого замера подложка и появилась"
    date: "2026-09-05"
    verdict: works
  - source: "шортсы podcast_clips/src01_h08 и _h19, стиль social_shorts (Russo One, обводка 5 px)"
    measured: "QA: контраст к фону 2.9:1, ниже 4.5:1 на 55–62% показа; человек посмотрел готовый ролик на телефоне — белый текст на светлой футболке читается, подложка выглядит грубой полосой. Взяли без подложки"
    date: "2026-09-09"
    verdict: failed

notes: >-
  Когда НЕ брать. Замер контраста не видит обводку: он сравнивает цвет текста с
  яркостью кадра под ним, а обводка в 5 px отделяет буквы сама. Поэтому
  «контраст 2.9:1, читается впритык» — это совет посмотреть, а не команда
  ставить подложку; на шортсах podcast_clips посмотрели и выбрали обводку. Подложка
  честно нужна там, где обводка не помогает: мелкий кегль, пёстрый фон,
  движущиеся светлые пятна под строкой.
  Со стилями, где слова появляются по очереди (`words_in_place`, `line_grows`),
  подложка растёт вместе с текстом: у спрятанного слова прозрачна и её часть.
  Проверено глазами на шортсе — читается как расширяющаяся плашка, а не как
  дырки в полосе.
  Рисованному кадру подложка обычно не нужна: там фон под субтитрами
  выбирает художник, и обводки хватает — отсюда `applies_when: footage=filmed`.
