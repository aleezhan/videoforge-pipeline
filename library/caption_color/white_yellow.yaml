    measured: "контраст белого к чёрной обводке 21:1; жёлтый #FFD400 отличим от белого при кегле 56 px"
    date: "2026-09-08"
    verdict: works
  - source: "QA первого шортса podcast_clips (src01_h08)"
    measured: "белый текст на белой футболке: «сливается» на 4 кадрах из 4 — обводка 3 px не спасает"
    date: "2026-09-07"
    verdict: failed

notes: >-
  Граница: светлый фон под строкой (белая одежда, небо, снег). Там — подложка,
  см. cream_on_glass.
