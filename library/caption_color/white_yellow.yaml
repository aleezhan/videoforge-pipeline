id: white_yellow
decision: caption_color
title: Белый + жёлтый
summary: белые слова с чёрной обводкой, произносимое слово жёлтым; подложки нет
status: implemented

always: true
applies_when: {}
never_when: {}

params:
  color: "#FFFFFF"
  highlight: "#FFD400"
  outline_color: "#000000"
  outline: 3.0
  box_opacity: 0.0

implemented_by: "caption_styles/<id>.yaml: color, highlight, outline_color, outline, box_opacity"

evidence:
