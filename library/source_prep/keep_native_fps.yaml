id: keep_native_fps
decision: source_prep
title: Не пересчитывать кадры
summary: собирать в частоте исходника; пересчёт 24→30 дублирует каждый четвёртый кадр, 30→24 выбрасывает каждый пятый — движение спотыкается
status: implemented
always: true
applies_when: {}
never_when: {}

params:
  anime_fps: 24

implemented_by: "не ставить фильтр fps при резке; кодировать как есть"

evidence:
  - source: "reference reel (30 fps) против исходной серии (24 fps)"
    measured: "покадровое совпадение упирается в потолок ~85% целых кадров: пересчёт дублирует каждый пятый кадр, и фаза дублирования у автора своя"
    date: "2026-09-05"
    verdict: works

notes: >-
  Побочное следствие, полезное при разборе чужого ролика: если эталон и
  исходник идут в разной частоте, покадрово сойтись НЕЛЬЗЯ в принципе, и
  гнаться за этим не надо. Проверять частоту обоих файлов до сравнения.
