id: slow_zoom_static
decision: framing
title: Медленный наезд
summary: кадр, где никто не движется, едет сам — наезд до 6% за план, апскейл lanczos перед zoompan
status: implemented

always: false
applies_when:
  footage: [animation, filmed]
never_when: {}

params:
  zoom_per_shot_max: 1.06     # больше — заметна потеря резкости
  upscale_before: 2           # во сколько раз растянуть кадр до zoompan
  scaler: lanczos

implemented_by: "ffmpeg: scale x2 lanczos → zoompan → scale обратно, до цветокоррекции"

evidence:
  - source: "план 06:17–06:22 Re:Zero S4 серия 14 (Рам гладит спящую Рем), 720p"
    measured: >-
      резкость (дисперсия лапласиана) без наезда 387→376. Наивный zoompan:
      339→303, то есть 13% теряется УЖЕ В НАЧАЛЕ, при масштабе ~1.0.
      С апскейлом lanczos перед zoompan: 364→340 (94%/90% от оригинала).
      Наезд 12% при том же конвейере: 363→308 (82% в конце) — заметно мягче.
    date: "2026-09-05"
    verdict: works

notes: >-
  Зачем вообще: материал бывает статичным (14-я серия Re:Zero — средняя энергия
  движения 4.0 против 12.1 у эталонного реела, а в выбранных планах 0.8–2.4).
  Приём scene_recut_realtime там неприменим — «быстрым ролик делает сама
  анимация» больше не работает, движение приходится создавать.
  ЛОВУШКА: zoompan пересемплирует кадр даже при z=1.0, поэтому потеря резкости
  появляется до всякого увеличения — сравнивать надо не «начало против конца»,
  а против исходника без фильтра вообще.
  ВТОРАЯ: crop с выражением от t не годится (размер кадра фильтр берёт один раз
  при инициализации); менять по времени можно только положение окна, не размер.
