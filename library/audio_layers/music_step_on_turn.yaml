id: music_step_on_turn
decision: audio_layers
title: Ступень громкости на смене мысли
summary: там, где ролик поворачивает — новая глава, вывод, кульминация, — музыка ступенькой поднимается или падает, и поворот слышен, даже если картинка не сменилась
status: implemented

always: false
applies_when:
  music: true
never_when: {}

params:
  step_db: 6.0              # рабочий шаг; меньше 3 дБ не читается, больше 10 — скачок
  step_range_db: [3.0, 10.0]
  ramp_sec: 1.0             # ffmpeg.GAIN_RAMP_SEC — ступень не прыжок, а подъезд

implemented_by: "план монтажа: music.cues → MusicMix.gain_steps → core/ffmpeg.gain_expr (volume с eval=frame)"

evidence:
  - source: "core/ffmpeg.gain_expr, розовый шум 60 с (ровный сигнал вместо музыки: у музыки свой уровень гуляет и ступень в нём не видна)"
    measured: "просили +3 / +6 / +10 дБ — замерено +3.10 / +6.10 / +10.10 дБ; подъезд по окнам 0.2 с достигает цели к 0.8–1.0 с после отметки"
    date: "2026-09-09"
    verdict: works
  - source: "тот же замер сперва на resources/music/soft_pad.wav"
    measured: "ступень +6 дБ прочиталась как −2.0 дБ: собственная модуляция подложки гуляет на ±4 дБ по окнам 1 с и накрывает ступень"
    date: "2026-09-09"
    verdict: failed

notes: >-
  Второй замер важнее первого: он говорит, ЧЕМ проверять. Ступень на музыке
  глазами по RMS не видна — проверять надо на ровном сигнале, а на реальном
  треке смотреть план монтажа и слушать. Величина ступени в план пишется
  относительно gain_db трека, а не в абсолютных дБ, поэтому она переживает
  замену трека.
  Ступень — не то же, что даккинг: даккинг реагирует на речь и возвращается
  сам, ступень ставится в секунду смысла и остаётся. Их можно и нужно
  совмещать: gain_steps применяется до sidechaincompress.
