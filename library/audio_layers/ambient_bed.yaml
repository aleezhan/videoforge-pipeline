id: ambient_bed
decision: audio_layers
title: Подложка под всю дорожку
summary: непрерывный фон тише голоса на 20 дБ идёт от первой секунды до последней — между репликами больше нет цифровой тишины
status: implemented

# Приём про ИИ-ролик с озвучкой: у него дыры между репликами. У нарезки из
# чужого видео дыр нет — там своя комнатная тишина исходника (замерено), и
# вторая подложка поверх неё только мутит звук.
always: false
applies_when:
  has_speech: true
  footage: generated
never_when:
  format: clips_from_long

params:
  gain_db: -20.0            # относительно голоса; трек сперва приводится к его уровню
  gain_range_db: [-26.0, -14.0]
  useless_below_db: -32.0   # тише этого подложка не слышна ни детектору, ни зрителю
  loop: true

implemented_by: "assemble — music-ресурс с loop_ok: true, уровень через MusicMix.gain_db (или resources/sfx/crowd_arena.wav как готовая петля)"

evidence:
  - source: "doc_channel/ep001, готовый final.mp4, 506.6 с"
    measured: "тишина 267.3 с — 53% хронометража, 92 куска, медиана паузы 1.82 с, 74 паузы длиннее 1.5 с, самая длинная 17.3 с; в паузах уровень −91.0 дБ, то есть цифровой ноль, а не тихая комната"
    date: "2026-09-09"
    verdict: failed
  - source: "тот же ep001, кусок 130–212 с (в нём дыра 16.6 с), подложка soft_pad подмешана на разных уровнях"
    measured: "без подложки 53.6 с тишины из 82.2 (65%); −14 дБ к голосу → 0.0 с; −20 дБ → 0.0 с; −26 дБ → 4.6 с; −32 дБ → 39.2 с"
    date: "2026-09-09"
    verdict: works
  - source: "тот же кусок, подложка на −38 дБ к голосу"
    measured: "тишина 53.6 с — ровно столько же, сколько без подложки"
    date: "2026-09-09"
    verdict: failed
  - source: "podcast_clips/src01_h08 и _h19, готовые шортсы 26.4 и 34.4 с"
    measured: "тишина 0.0 с в обоих — дорожка исходника несёт свой зал и не молчит никогда"
    date: "2026-09-09"
    verdict: works

notes: >-
  Главное число здесь — граница полезности. Подложка тише −32 дБ относительно
  голоса не меняет ни одного замера: детектор тишины (silencedetect −40 дБ) её
  не слышит, а значит не услышит и зритель в наушниках в метро. Ставить фон
  «на всякий случай, чтобы не мешал» бессмысленно — либо −26…−14, либо никак.
  Замер делать на КУСКЕ с настоящей дырой, а не на среднем по ролику: средняя
  тишина размазывает семнадцатисекундный провал по всему хронометражу.
  Верхняя граница −14 дБ не измерена как порог разборчивости речи, она просто
  крайняя из проверенных; выше поднимать — только вместе с даккингом
  (duck_music_under_dialogue) и проверкой на слух.
