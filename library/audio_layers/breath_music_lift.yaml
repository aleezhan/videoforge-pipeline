id: breath_music_lift
decision: audio_layers
title: "Выдох: музыка вместо паузы"
summary: там, где сценарий даёт зрителю отдышаться, музыка не просто возвращается на свой уровень, а поднимается на несколько дБ — пауза звучит как выдох, а не как обрыв
status: recorded

always: false
applies_when:
  music: true
  has_speech: true
never_when: {}

params:
  lift_db: [3.0, 6.0]       # насколько музыка выше своего уровня в паузе
  min_gap_sec: 2.0          # короткие паузы между фразами не трогать — будет качание
  ramp_sec: 1.0

implemented_by: ""

evidence:
  - source: "doc_channel/ep001: паузы, размеченные сценаристом как «выдох», в готовом файле"
    measured: "74 паузы длиннее 1.5 с, в них уровень −91.0 дБ (цифровой ноль); самая длинная 17.3 с, хвост ролика 490.0–505.6 с — 15.6 с тишины подряд"
    date: "2026-09-09"
    verdict: failed
  - source: "рендерная часть приёма проверена отдельно: core/ffmpeg.gain_expr"
    measured: "ступени +3 / +6 / +10 дБ отрабатывают с точностью 0.1 дБ и подъездом 1.0 с — поднять музыку в нужную секунду мы умеем"
    date: "2026-09-09"
    verdict: works

notes: >-
  Не реализовано, и не хватает ровно одного звена: НАЙТИ паузы автоматически.
  Рендер готов (gain_steps точны до 0.1 дБ), материал готов, разметка выдохов
  есть в 01_script/retention.json — нет кода, который превращает «пауза
  длиннее 2 с» в ступень плана монтажа. Сегодня это пишется рукой в
  edit_plan.json (author: manual).
  Почему это отдельный приём, а не настройка ambient_bed: подложка делает
  паузу НЕ пустой, а выдох делает её СОБЫТИЕМ. Первое — гигиена, второе —
  драматургия, и применяются они в разных местах: подложка везде, выдох в
  трёх-четырёх точках ролика.
  Ловушка, которую видно заранее: поднимать музыку в каждую межфразовую
  паузу нельзя — на паузах по 1.8 с (медиана ep001) это даст качание уровня
  раз в две секунды. Отсюда min_gap_sec.
