id: source_audio_under_music
decision: audio_layers
title: Звук исходника под музыкой
summary: реплики, крики и удары из исходника звучат тише музыки — без них ролик стерильный
status: implemented

always: false
applies_when:
  music: true
  footage: [animation, filmed]
never_when:
  footage: [generated]

params:
  gain_vs_music: 0.30      # ~ -10 дБ; у эталона измерено 0.35 (-13 дБ)

implemented_by: "ffmpeg amix двух дорожек; уровень аниме задан коэффициентом"

evidence:
  - source: "reference reel, разложение громкости по 1132 окнам"
    measured: "музыка одна объясняет 0.488 дисперсии, музыка+исходник 0.578, слои независимы (0.072); пропорция 2.08 : 0.35"
    date: "2026-09-05"
    verdict: works
  - source: "первая сборка того же ролика без этого слоя"
    measured: ""
    date: "2026-09-05"
    verdict: failed

notes: >-
  Диагностический признак при разборе чужого ролика: совпадение звука с
  найденным треком заметно ниже единицы (у нас 0.549 вместо 0.9+). Читать это
  как «в миксе есть ещё слой», а не как погрешность обработки — именно на этом
  я и ошибся. Для generated не годится: у i2v-клипов своего звука нет.
