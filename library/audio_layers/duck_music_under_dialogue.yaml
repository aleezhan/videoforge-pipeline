id: duck_music_under_dialogue
decision: audio_layers
title: Музыка тише под речь
summary: музыка проседает на 6 дБ там, где в исходнике говорят, — слова становятся разборчивы
status: implemented

always: false
applies_when:
  music: true
  has_speech: true
never_when: {}

params:
  duck_db: -6.0
  ramp_sec: 0.18
  speech_modulation_hz: [3, 8]

implemented_by: "детектор речи по слоговой модуляции → выражение для volume (eval=frame)"

evidence:
  - source: "аниме-эдит по 15-й серии Re:Zero S4, сцена падения"
    measured: "внутри реплик -6.00 дБ, вне -0.00 дБ; приглушение занимает 21% времени при 15% речи"
    date: "2026-09-05"
    verdict: works
  - source: "тот же ролик, попытка через sidechaincompress по громкости"
    measured: "музыка приглушена 91% времени, разница речь/тишина всего 4 дБ"
    date: "2026-09-05"
    verdict: failed

notes: >-
  Сайдчейн по ГРОМКОСТИ здесь не работает, и это главное знание приёма: в
  сцене с ветром и ударами шум в голосовой полосе 300-3000 Гц не тише речи.
  Различает не громкость, а ритм: у речи огибающая пульсирует на слоговой
  частоте 3-8 Гц, у гула и ветра такой пульсации нет. `volume` с выражением
  требует eval=frame, иначе выражение посчитается один раз на старте.
  Детектор проверять картинкой: в найденные моменты у персонажа в кадре должен
  открываться рот (у нас подтвердилось на 2 участках из 6, остальные — реплики
  за кадром).
