id: sfx_on_cut
decision: audio_layers
title: Звук на склейке
summary: удар, пролёт или щелчок ставится НА кадр смены, а не после неё — склейка перестаёт быть дырой и читается как решение монтажёра
status: implemented

# Склейка есть в любом ролике, поэтому «всегда» — это решение, а не пропуск
# условий. Ограничивает приём не тип ролика, а квота: см. notes.
always: true
applies_when: {}
never_when: {}

params:
  gain_db: -6.0             # прямой гейн файла: библиотека звуков выровнена по пику
  offset_sec: 0.0           # звук в тот же кадр, что и смена
  per_minute_warn: 10
  per_minute_block: 20

implemented_by: "план монтажа: sfx → core/ffmpeg.Sound → finalize (adelay, без даккинга под них)"

evidence:
  - source: "doc_channel/ep001, кусок 130–212 с; impact_deep на −6 дБ поставлен в 12-ю секунду, внутри дыры тишины"
    measured: "секунда удара −27.8 дБ против −91.0 дБ у соседних — акцент выше фона на 48.8 дБ; в самом файле, а не в сравнении с ненормализованным исходником"
    date: "2026-09-09"
    verdict: works
  - source: "тот же прогон, но с вопросом «а не закроет ли удар тишину»"
    measured: "тишина 53.6 → 53.1 с, самая длинная дыра 16.6 → 16.4 с: удар 0.9 с убрал 0.5 с из 53.6"
    date: "2026-09-09"
    verdict: failed

notes: >-
  Второй замер — граница приёма, и её стоит помнить дословно: точечный звук
  НЕ лечит тишину. Шестнадцатисекундная дыра осталась шестнадцатисекундной.
  Дыру закрывает подложка (ambient_bed), а удар делает акцент — это разные
  задачи, и подменять одну другой значит поставить двадцать ударов подряд
  и получить рванину вместо ролика.
  Отсюда квоты линта на минуту хронометража (edit_lint): 20 звуков в минуту —
  блок, 10 — предупреждение. Модель, которой дали удар, ставит его везде.
  Сравнивать уровни надо ВНУТРИ одного готового файла: finalize делает
  loudnorm, и разница между файлом «до» и файлом «после» — это смещение
  нормализатора, а не громкость эффекта (на этом первый замер и сломался,
  показав удар как −5.7 дБ).
