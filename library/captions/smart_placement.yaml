id: smart_placement
decision: captions
title: Текст в свободное место
summary: текст встаёт туда, где пусто, и не закрывает лицо или важный предмет; кегль пляшет по смыслу
status: implemented

always: false
applies_when:
  aspect: ["9:16", "16:9"]
never_when: {}

params:
  face_margin: [0.1, 0.15]    # насколько расширить рамку лица перед запретом
  search_step_px: 16
  prefer_lower_third: true    # при равной пустоте текст уходит вниз

implemented_by: >-
  YuNet (core/faces.detect_at) даёт запретные прямоугольники, дисперсия
  лапласиана по окну — «пустоту»; перебор позиций с шагом 16 px, минимум
  штрафной суммы. Размер надписи МЕРИТЬ рендером, не формулой.

evidence:
  - source: "эдит «боль» из Re:Zero S4 серия 14, три надписи на 29 с"
    measured: >-
      GOODBYES ушло в правый нижний угол (занятость 0 при фоне-стене),
      ON MY OWN — вправо на стену (2), LET GO на крупном плане лица получило 7:
      свободного места в кадре нет физически, лицо занимает ~90% площади.
    date: "2026-09-05"
    verdict: works

notes: >-
  ЛОВУШКА, стоившая прогона: ширину надписи нельзя оценивать как
  «символов × доля кегля». Оценка 0.40 кегля на символ дала для GOODBYES 269 px
  при реальных 388 — слово уехало за край кадра. Меряется рендером текста на
  чёрном и рамкой ненулевых пикселей (один вызов ffmpeg).
  Граница приёма: когда лицо занимает почти весь кадр, свободного места нет
  вообще, и «умное размещение» вырождается в выбор наименее плохого. Тогда
  честнее не ставить текст на этот план — картинке дают дышать.
