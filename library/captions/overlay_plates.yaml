id: overlay_plates
decision: captions
title: Плашка сверху
summary: >-
  текст, который зритель должен прочитать, идёт слоем сборки поверх кадра:
  вывод реплики с ключевым словом цветом подсветки по центру сверху, ссылка на
  источник справа, ярлык пункта слева; в сгенерированной картинке текста нет
status: implemented

always: false
applies_when:
  format: ai_video
  has_speech: true
never_when: {}

params:
  kinds: [caption, source, label]
  max_chars: 56               # длиннее за секунду не прочитать
  position: top               # субтитры живут внизу, два текста в одной полосе не читаются
  size_pct: 3.6               # кегль, % короткой стороны (субтитры 5.2)
  box_opacity: 0.6            # тёмное стекло под текстом
  key_word: highlight         # ключевое слово — цветом подсветки субтитров (жёлтый)
  one_per_scene: true

implemented_by: >-
  Scene.overlay (пишет планнер, поле overlay в JSON сцены) → core/captions.build_ass:
  стили Overlay / OverlayLabel / OverlaySource в том же ASS, что субтитры, слой 1;
  соседние сцены с одной плашкой сливаются в одно событие (assemble.overlay_events);
  QA меряет контраст к фону в секунды показа (overlay_contrast) и зону интерфейса
  (overlay_zone); вид — поля overlay_* у caption_styles/<id>.yaml

evidence:
  - source: "research/ref_channel_a — покадровый разбор 6 хитов канала (07.09.2026)"
    measured: >-
      постоянный текстовый слой в 6 из 6 хитов: верхняя плашка 2–5 слов на
      каждой склейке плюс караоке-субтитры; у слабого «7 мусульман» (3598
      просмотров, ratio 0.14) ни плашек, ни субтитров
    date: "2026-09-07"
    verdict: works
  - source: "doc_channel/ep001_replan — первый прогон планнера с полем overlay"
    measured: >-
      46 плашек на 98 битов (38 caption, 7 source, 1 label); рендер проверен
      кадром 1:1 на мок-финале 1920×1080 — три вида на своих местах, подложка,
      ключевое слово жёлтым; ключевые слова модель выбирала слабо («не»,
      «только», «Три») — служебные слова теперь отсеивает python
    date: "2026-09-08"
    verdict: works

notes: >-
  Плашка на каждой сцене — шум: планнер на ep001 поставил их на 47% битов, и
  сколько это «слишком», решит просмотр готового ролика. Для эдита под музыку
  (anime_edit) не годится: там текст — часть композиции кадра, см. smart_placement.
  Правило playbook «не выводить на экран числа» опровергнуто именно на этой
  нише (ref_channel_a), его scope — аудио-повествование без видеоряда.
